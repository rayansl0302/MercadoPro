name: Publicar imagem do painel

# A cada mudança em painel/ na branch main, gera a imagem e publica em ghcr.io.
# O servidor (Watchtower) baixa a nova versão sozinho.
on:
  push:
    branches: [main]
    paths: ['painel/**', '.github/workflows/painel-imagem.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # testes da API (PostgreSQL de teste dentro do próprio job)
      - name: Testar a API
        working-directory: painel/api
        env:
          DATABASE_ADMIN_URL: postgres://painel:teste@localhost:5432/postgres
          DATABASE_URL: postgres://painel:teste@localhost:5432/painel_test
          NODE_ENV: test
          CONTRATO_LOJA: ${{ github.workspace }}/src/nuvem/contrato.json
        run: |
          docker run -d --name pg -e POSTGRES_USER=painel -e POSTGRES_PASSWORD=teste -e POSTGRES_DB=painel -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U painel -d painel && break; sleep 2; done
          npm install --no-audit --no-fund
          npx vitest run

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: painel
          push: true
          tags: |
            ghcr.io/rayansl0302/mercadopro-painel:latest
            ghcr.io/rayansl0302/mercadopro-painel:${{ github.sha }}
